name: macOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            node: 24
          - runner: macos-15-intel
            arch: x64
            node: 24
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
      - name: Install Rust and record environment
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup target add wasm32-unknown-unknown --toolchain stable
          rustup override set stable
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) process.exit(1)'
          mkdir -p target/ci
          {
            sw_vers
            sysctl -n machdep.cpu.brand_string
            rustc --version --verbose
            node --version
            pnpm --version
          } > target/ci/environment.txt
      # Cheap gates first: fail fast on formatting/lint before the
      # multi-minute native and Wasm builds.
      - run: cargo fmt --all --check
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Build native addon, SDK and examples
        run: pnpm build
      - name: Verify packed VST3 SDK and matching platform helper
        run: node scripts/smoke-vst3-package.mjs
      - name: Build import-free Wasm engine
        run: pnpm build:wasm
      - name: Build GPUI viewer and development bundle
        run: node scripts/build-preview.mjs --debug
      - name: Verify generated schemas
        run: |
          pnpm schemas
          git diff --exit-code -- schemas
          test -z "$(git ls-files --others --exclude-standard schemas)"
      # tsc --noEmit resolves cross-package types through built dist output,
      # so typecheck must stay after the workspace build.
      - run: pnpm typecheck
      - run: cargo test --workspace --locked
      - name: Verify isolated VST3 host and realtime ports without devices
        run: cargo test -p oxitone-vst3-host --features host,stream --locked
      - name: Verify VST3 processor clocks and transport context without devices
        env:
          OXITONE_VST3_TRANSPORT_REPORT: target/ci/vst3-transport.json
        run: node scripts/smoke-vst3-transport.mjs
      - name: Verify VST3 buses, sidechain and instrument output routing without devices
        env:
          OXITONE_VST3_BUS_REPORT: target/ci/vst3-buses.json
        run: node scripts/smoke-vst3-buses.mjs
      - name: Verify VST3 gesture clocks, loss detection and live SDK without devices
        env:
          OXITONE_VST3_EDITS_REPORT: target/ci/vst3-edits.json
        run: node scripts/smoke-vst3-edits.mjs
      - name: Verify VST3 configuration restarts, live SDK and DAW instance state restoration without devices
        env:
          OXITONE_VST3_CONFIGURATION_REPORT: target/ci/vst3-configuration.json
        run: node scripts/smoke-vst3-configuration.mjs
      - name: Verify VST3 DAW recording source transactions and exact offline replay without devices
        env:
          OXITONE_VST3_RECORDING_DAW_REPORT: target/ci/vst3-recording-daw.json
        run: node scripts/smoke-vst3-recording-daw.mjs
      - name: Verify VST3 runtime restart, graph recovery and PDC without devices
        env:
          OXITONE_VST3_RESTART_REPORT: target/ci/vst3-restart.json
        run: node scripts/smoke-vst3-restart.mjs
      - name: Verify VST3 MIDI, SysEx, MIDI-only chains and source persistence without devices
        env:
          OXITONE_VST3_MIDI_REPORT: target/ci/vst3-midi.json
        run: node scripts/smoke-vst3-midi.mjs
      - run: pnpm test
      - name: Verify Web Audio output in Chromium
        run: |
          pnpm --filter @oxitone/example-web exec playwright install chromium
          OXITONE_WEB_PORT=4175 pnpm example:web > target/ci/web-server.log 2>&1 &
          web_server_pid=$!
          trap 'kill "$web_server_pid" 2>/dev/null || true' EXIT
          for _attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4175/ > /dev/null; then break; fi
            sleep 1
          done
          OXITONE_WEB_URL=http://127.0.0.1:4175 pnpm test:web
      - name: Run portable offline examples
        run: |
          pnpm example
          pnpm example:drums
      - name: Run focused benchmarks
        run: |
          cargo bench -p oxitone-bench --bench slicer_tempo -- --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p oxitone-bench --bench insert_automation -- --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p oxitone-bench --bench plugin_process -- --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p oxitone-example-drums --bench process -- --warm-up-time 1 --measurement-time 3 --sample-size 30
          cargo bench -p oxitone-bench --bench preview -- --warm-up-time 1 --measurement-time 3 --sample-size 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checks-${{ matrix.arch }}-node-${{ matrix.node }}
          retention-days: 14
          path: |
            target/ci
            target/criterion
            target/examples/wasm/*.json
            target/examples/wasm/*.png
            target/examples/offline/*.json
            target/examples/drum-machine/report.json
