[package]
name = "oxitone-preview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "69e2130295c2649963eb639fc70b4f2ee8ea1624", default-features = false, features = ["font-kit", "runtime_shaders"] }
oxitone-core = { path = "../../crates/core" }
oxitone-graph = { path = "../../crates/graph" }
oxitone-render = { path = "../../crates/render" }
oxitone-transport = { path = "../../crates/transport" }
oxitone-dsp = { path = "../../crates/dsp" }
oxitone-instruments = { path = "../../crates/instruments" }
oxitone-mixer = { path = "../../crates/mixer" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
raw-window-handle = "0.6"
