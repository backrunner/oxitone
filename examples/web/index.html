<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oxitone · Web Audio</title>
<style>
:root{color-scheme:dark light;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;background:#101315;color:#e9efed}
*{box-sizing:border-box}body{max-width:1000px;margin:8vh auto;padding:0 28px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:48px}.brand{letter-spacing:.2em;font-size:15px;font-weight:700}.badge{color:#6de7bf;border:1px solid #345448;padding:7px 12px;border-radius:20px;font-size:12px}h1{font-size:clamp(34px,5vw,56px);letter-spacing:-.045em;margin:0 0 10px}p{color:#8d9d96;margin:0 0 32px;line-height:1.6}.panel{background:#1a2021;border:1px solid #313b39;border-radius:18px;padding:24px;margin:20px 0}canvas{width:100%;height:200px;background:linear-gradient(#1a2021,#151b1c);border-radius:10px}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}button,select{font:inherit;padding:11px 17px;color:inherit;border:1px solid #3b4944;border-radius:9px;background:#252e2a;cursor:pointer}button:hover{border-color:#6de7bf}#play{background:#6de7bf;color:#0b2920;min-width:110px;border-color:#6de7bf;font-weight:650}select{margin-left:auto}input{width:100%;accent-color:#6de7bf;margin:24px 0}#clock{font-variant-numeric:tabular-nums;margin-left:auto;color:#bdccc5}#metrics,#status{font-size:13px;color:#98aaa1}footer{margin-top:30px;font-size:13px;color:#7c9287}.controls button{font-size:13px;padding:9px 12px}
@media(prefers-color-scheme:light){:root{background:#eef3f0;color:#183229}.panel{background:#fff;border-color:#cfdbd4}canvas{background:#183029}button,select{background:#e5eee8;border-color:#bdcfc3}p,#status,#metrics,footer{color:#526c5f}#clock{color:#284d3d}}
</style></head><body>
<header><span class="brand">OXITONE</span><span class="badge">Wasm / Web Audio</span></header>
<h1>The same engine.<br>A new place to listen.</h1><p>Synthesizers, drums and effects rendered by Rust. Composed in TypeScript.</p>
<section class="panel"><div class="row"><button id="play">Play</button><button id="stop">Stop</button><select id="song"><option value="glass">Glass after rain · synth + drums</option><option value="after-the-horizon">After the horizon · full melodic dubstep</option></select></div>
<canvas id="scope" width="1800" height="400" aria-label="Live output waveform"></canvas><input id="seek" type="range" min="0" max="1" value="0" aria-label="Playback position"><div class="row"><span id="metrics">Ready for audio</span><span id="clock">0.0 s</span></div></section>
<div class="row controls"><button id="update">Update sound</button><button id="invalid">Test invalid update</button><button id="export">Download 8 s WAV</button></div>
<footer><span id="status">Press Play to start · Space to play or pause · Drag the timeline to seek</span></footer>
<script type="module" src="/main.js"></script></body></html>
