[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/graph",
    "crates/transport",
    "crates/dsp",
    "crates/instruments",
    "crates/samples",
    "crates/mixer",
    "crates/render",
    "crates/io-macos",
    "crates/napi",
    "crates/wasm",
    "crates/bench",
    "crates/example-drums",
    "apps/preview",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/backrunner/oxitone"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
debug = true
