<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Oxitone logo</title>
  <desc id="desc">A violet and cyan synthesizer waveform crossing a glowing O-shaped timeline mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111A34"/>
      <stop offset="1" stop-color="#070B18"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#65E8FF"/>
      <stop offset="0.48" stop-color="#5CC8FF"/>
      <stop offset="1" stop-color="#8B67FF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DE7FF"/>
      <stop offset="0.52" stop-color="#B06CFF"/>
      <stop offset="1" stop-color="#6D7BFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="48%" r="55%">
      <stop offset="0" stop-color="#385DCC" stop-opacity="0.24"/>
      <stop offset="0.72" stop-color="#14224B" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050814" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waveGlow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="984" height="984" rx="224" fill="url(#bg)"/>
  <rect x="21" y="21" width="982" height="982" rx="223" fill="url(#halo)"/>
  <rect x="42" y="42" width="940" height="940" rx="204" fill="none" stroke="#8BA8FF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- The O is a timeline loop: the small opening makes the waveform read clearly at icon size. -->
  <path d="M 792 512 A 280 280 0 1 1 710 310" fill="none" stroke="url(#ring)" stroke-width="54" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M 792 512 A 280 280 0 1 1 710 310" fill="none" stroke="url(#ring)" stroke-width="46" stroke-linecap="round"/>

  <!-- Oscillator waveform and playhead. -->
  <path d="M 166 512 H 282 C 316 512 318 420 352 420 C 386 420 388 604 422 604 C 456 604 458 350 492 350 C 526 350 528 674 562 674 C 596 674 598 420 632 420 C 666 420 668 512 702 512 H 858" fill="none" stroke="#59DFFF" stroke-opacity="0.22" stroke-width="34" stroke-linecap="round" filter="url(#waveGlow)"/>
  <path d="M 166 512 H 282 C 316 512 318 420 352 420 C 386 420 388 604 422 604 C 456 604 458 350 492 350 C 526 350 528 674 562 674 C 596 674 598 420 632 420 C 666 420 668 512 702 512 H 858" fill="none" stroke="url(#wave)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#waveGlow)"/>

  <path d="M 512 184 V 244" stroke="#63E7FF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 512 164 L 492 190 H 532 Z" fill="#B06CFF"/>

  <!-- Quiet timeline ticks anchor the mark in a DAW context. -->
  <g fill="#8BA8FF" fill-opacity="0.58">
    <rect x="294" y="812" width="8" height="24" rx="4"/>
    <rect x="360" y="812" width="8" height="16" rx="4"/>
    <rect x="426" y="812" width="8" height="24" rx="4"/>
    <rect x="590" y="812" width="8" height="24" rx="4"/>
    <rect x="656" y="812" width="8" height="16" rx="4"/>
    <rect x="722" y="812" width="8" height="24" rx="4"/>
  </g>
  <path d="M 324 824 H 696" stroke="#8BA8FF" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
</svg>
